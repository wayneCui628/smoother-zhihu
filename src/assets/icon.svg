<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 背景主渐变：现代知乎科技蓝 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF" />
      <stop offset="50%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#004CD6" />
    </linearGradient>

    <!-- 顶部高光弧形渐变 -->
    <linearGradient id="topGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- 主丝滑光带渐变 -->
    <linearGradient id="mainStreamGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="1" />
    </linearGradient>

    <!-- 辅助粒子与光轨渐变 -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- 阴影滤镜 -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#002B7A" flood-opacity="0.45" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. 底座背景（iOS Squircle 风格连续曲率圆角矩形） -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGrad)" filter="url(#dropShadow)" />

  <!-- 2. 内部顶部光泽层（提升高级拟态质感） -->
  <rect x="32" y="32" width="448" height="224" rx="108" fill="url(#topGlow)" />

  <!-- 3. 背景流速粒子与微光轨 -->
  <path d="M 120 370 C 180 370, 240 330, 310 270 C 350 235, 390 200, 420 180" 
        fill="none" stroke="#60A5FA" stroke-width="8" stroke-linecap="round" stroke-dasharray="16 20" opacity="0.4" />
  
  <circle cx="160" cy="365" r="7" fill="#93C5FD" opacity="0.6" />
  <circle cx="280" cy="295" r="9" fill="#93C5FD" opacity="0.7" />
  <circle cx="380" cy="205" r="6" fill="#BAE6FD" opacity="0.5" />

  <!-- 4. 核心主视觉：动感破风丝滑流动波浪 (Smooth Aerodynamic Wave) -->
  <!-- 采用平滑贝塞尔曲面，由起步缓流到冲刺飞跃，象征知乎长页面丝滑加速流动 -->
  <path d="M 100 350 
           C 160 350, 210 320, 260 260 
           C 310 200, 350 160, 412 150
           C 390 190, 340 240, 290 295
           C 230 360, 170 385, 100 350 Z" 
        fill="url(#mainStreamGrad)" 
        filter="url(#dropShadow)" />

  <!-- 5. 伴随流线（次级飞跃波瓣，营造如丝绸般层叠的轻盈感） -->
  <path d="M 140 290
           C 190 290, 230 260, 280 205
           C 325 155, 360 130, 410 120
           C 385 145, 350 180, 310 230
           C 255 295, 200 315, 140 290 Z"
        fill="#FFFFFF" 
        opacity="0.85" />

  <!-- 6. 核心加速高光光晕圆环（象征极速就绪与活跃节点） -->
  <circle cx="415" cy="135" r="22" fill="#FFFFFF" filter="url(#softGlow)" />
  <circle cx="415" cy="135" r="14" fill="#38BDF8" />
  <circle cx="415" cy="135" r="7" fill="#FFFFFF" />

  <!-- 7. 底部轻盈尾流反光 -->
  <ellipse cx="140" cy="385" rx="35" ry="8" fill="#38BDF8" opacity="0.3" filter="url(#softGlow)" />
</svg>
