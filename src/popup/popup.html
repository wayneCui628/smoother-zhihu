<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知乎顺滑器</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="masthead">
        <div class="masthead-brand">
          <img class="brand-logo" src="../assets/icon-128.png" alt="知乎顺滑器 Logo" width="36" height="36">
          <div class="brand-text">
            <p class="eyebrow">浏览器扩展 · 性能优化</p>
            <h1>知乎顺滑器</h1>
          </div>
        </div>
        <p class="intro">自动冻结远离屏幕的回答，让长页面滚动保持流畅。</p>
      </header>

      <section class="panel settings-panel" aria-labelledby="enabled-title">
        <div class="setting-row">
          <div class="setting-copy">
            <h2 id="enabled-title">当前优化</h2>
            <p id="toggle-hint">在知乎回答页启用流畅加载</p>
          </div>
          <label class="toggle-control">
            <input id="enabled-toggle" type="checkbox" checked aria-describedby="toggle-hint">
            <span class="toggle-track" aria-hidden="true"><span class="toggle-thumb"></span></span>
            <span class="sr-only">启用知乎顺滑器</span>
          </label>
        </div>
        <div class="setting-row">
          <div class="setting-copy">
            <h2 id="widget-title">页面悬浮窗</h2>
            <p id="widget-toggle-hint">在知乎页展示实时优化效果</p>
          </div>
          <label class="toggle-control">
            <input id="show-page-widget-toggle" type="checkbox" checked aria-describedby="widget-toggle-hint">
            <span class="toggle-track" aria-hidden="true"><span class="toggle-thumb"></span></span>
            <span class="sr-only">显示页面悬浮窗</span>
          </label>
        </div>
      </section>

      <section class="panel buffer-panel" aria-labelledby="buffer-title">
        <div class="section-heading">
          <div>
            <h2 id="buffer-title">缓冲范围</h2>
            <p>视口上下各预留几屏不冻结，越大越稳妥</p>
          </div>
          <output id="buffer-value" class="value-mark" for="buffer-1 buffer-2 buffer-4">均衡 · 上下各 2 屏</output>
        </div>

        <fieldset class="buffer-options">
          <legend class="sr-only">选择缓冲范围</legend>
          <label class="buffer-option">
            <input id="buffer-1" type="radio" name="bufferViewports" value="1">
            <span class="option-face"><strong>极速</strong><small>上下各 1 屏</small></span>
          </label>
          <label class="buffer-option">
            <input id="buffer-2" type="radio" name="bufferViewports" value="2" checked>
            <span class="option-face"><strong>均衡</strong><small>上下各 2 屏</small></span>
          </label>
          <label class="buffer-option">
            <input id="buffer-4" type="radio" name="bufferViewports" value="4">
            <span class="option-face"><strong>稳妥</strong><small>上下各 4 屏</small></span>
          </label>
        </fieldset>
      </section>

      <section class="status-card" aria-labelledby="status-title" aria-live="polite">
        <div class="status-heading">
          <div class="status-label">
            <span id="status-dot" class="status-dot" aria-hidden="true"></span>
            <h2 id="status-title">正在等待知乎回答页</h2>
          </div>
          <span id="status-rule" class="status-rule">待机</span>
        </div>
        <p id="stats-text" class="stats-text">仅在知乎长回答页工作</p>
        <dl class="stat-grid" aria-label="当前页面数据">
          <div>
            <dt>回答总数</dt>
            <dd id="total-answers">—</dd>
          </div>
          <div>
            <dt>已冻结</dt>
            <dd id="parked-answers">—</dd>
          </div>
          <div>
            <dt>保持显示</dt>
            <dd id="live-answers">—</dd>
          </div>
        </dl>
        <p class="stat-note">保持显示的数量与回答长短相关，一篇长回答可能占据多屏。</p>
      </section>

      <button id="restore-button" class="restore-button" type="button" disabled>
        恢复本页全部回答
      </button>
      <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
